<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng size | ClothesStore Admin</title>

    <!-- Nạp 3 file CSS chuẩn của hệ thống -->
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/admin.css">
</head>

<body>
    <div class="admin-shell">
        <!-- 1. Menu bên trái (layout.js tự nạp vào) -->
        <aside id="sidebar" class="sidebar"></aside>

        <div class="admin-main">
            <!-- 2. Topbar trên cùng (layout.js tự nạp vào) -->
            <header id="topbar" class="topbar"></header>

            <!-- 3. Khu vực nội dung Bảng size -->
            <main class="admin-content">
                <div class="page-header">
                    <div>
                        <h1>Bảng size chuẩn</h1>
                        <p class="page-subtitle">Quản lý các thông số kích thước hướng dẫn chọn size theo từng loại danh mục sản phẩm.</p>
                    </div>
                    <div class="page-actions">
                        <button type="button" class="btn btn-primary" id="btnAdd">+ Thêm size</button>
                    </div>
                </div>

                <div class="card">
                    <!-- Thanh công cụ tìm kiếm và lọc theo danh mục -->
                    <div class="toolbar">
                        <input type="search" class="input search-input" id="searchInput"
                            placeholder="Tìm theo size, thông số, danh mục...">
                        <select class="input select" id="categoryFilter" style="max-width: 220px;">
                            <option value="">-- Tất cả danh mục --</option>
                        </select>
                    </div>

                    <!-- Bảng dữ liệu và thanh phân trang -->
                    <div id="tableContainer"></div>
                    <div id="paginationContainer"></div>
                </div>
            </main>
        </div>
    </div>

    <!-- Nạp file Javascript điều khiển -->
    <script type="module" src="../js/catalog/size-charts.js"></script>
</body>

</html>

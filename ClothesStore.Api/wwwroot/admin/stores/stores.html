<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cửa hàng | ClothesStore Admin</title>
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body>
    <div class="admin-shell">
        <aside id="sidebar" class="sidebar"></aside>
        <div class="admin-main">
            <header id="topbar" class="topbar"></header>
            <main class="admin-content">
                <div class="page-header">
                    <div><h1>Cửa hàng</h1><p class="page-subtitle">Quản lý danh sách cửa hàng trong hệ thống.</p></div>
                    <div class="page-actions"><button type="button" class="btn btn-primary" id="btnAdd">+ Thêm cửa hàng</button></div>
                </div>
                <div class="card">
                    <div class="toolbar"><input class="input search-input" id="searchInput" placeholder="Tìm tên hoặc địa chỉ cửa hàng..."><button class="btn btn-secondary" id="btnReload">Tải lại</button></div>
                    <div id="tableContainer"></div><div id="paginationContainer"></div>
                </div>
            </main>
        </div>
    </div>
    <script type="module" src="../js/stores/stores.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thống kê cửa hàng | ClothesStore Admin</title>
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body>
    <div class="admin-shell">
        <aside id="sidebar" class="sidebar"></aside>
        <div class="admin-main">
            <header id="topbar" class="topbar"></header>
            <main class="admin-content">
                <div class="page-header">
                    <div><h1>Thống kê cửa hàng</h1><p class="page-subtitle">Doanh thu, đơn hàng và sản phẩm bán theo ngày.</p></div>
                    <div class="page-actions"><button type="button" class="btn btn-secondary" id="btnReload">Tải lại</button></div>
                </div>
                <div class="card">
                    <div class="toolbar">
                        <label for="storeFilter">Cửa hàng</label><select class="select" id="storeFilter"><option value="">Tất cả cửa hàng</option></select>
                        <label for="dateFrom">Từ ngày</label><input class="input" type="date" id="dateFrom">
                        <label for="dateTo">Đến ngày</label><input class="input" type="date" id="dateTo">
                        <button class="btn btn-primary" id="btnFilter">Lọc</button>
                    </div>
                    <h2 class="card-header">Tổng quan theo ngày</h2><div id="dailyTable"></div><div id="dailyPagination"></div>
                </div>
                <div class="card" style="margin-top:1rem">
                    <h2 class="card-header">Thống kê sản phẩm</h2><div id="itemTable"></div><div id="itemPagination"></div>
                </div>
            </main>
        </div>
    </div>
    <script type="module" src="../js/stores/statistics.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sản phẩm | AURA Techwear</title>
    <meta name="description" content="Tất cả sản phẩm AURA Techwear">
    <!-- Đặt giao diện sáng/tối TRƯỚC khi vẽ trang để không bị nháy màu -->
    <script>try{document.documentElement.dataset.theme=localStorage.getItem("aura-theme")||"dark"}catch(e){}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
    <link rel="stylesheet" href="./css/shop.css">
</head>
<body>
    <header id="siteHeader"></header>
    <main class="page">
        <div class="container">
            <nav class="crumbs" aria-label="Đường dẫn"><a href="/shop/index.html">Trang chủ</a><span class="sep">/</span><a href="/shop/products.html">Sản phẩm</a><span class="sep">/</span><span class="current" id="crumbCurrent">Tất cả</span></nav>
            <div class="row-between wrap">
                <h1 class="page-title"><span id="pageTitle">Tất cả sản phẩm</span> <span class="accent mono" style="font-size:.45em" id="pageCount"></span></h1>
                <div class="row wrap">
                    <form class="input-group" id="searchForm" role="search">
                        <input class="input" id="searchInput" placeholder="Tìm trong danh sách..." aria-label="Tìm sản phẩm">
                        <button class="btn">Tìm</button>
                    </form>
                    <select class="select" id="sortSelect" aria-label="Sắp xếp" style="width:auto">
                        <option value="new">Mới nhất</option>
                        <option value="price-asc">Giá tăng dần</option>
                        <option value="price-desc">Giá giảm dần</option>
                        <option value="name">Tên A - Z</option>
                    </select>
                </div>
            </div>
            <div class="layout-sidebar mt-4">
                <aside class="stack">
                    <section class="panel panel-pad">
                        <h3 class="upper text-sm" style="margin-bottom:10px">Danh mục</h3>
                        <div id="catTree"><div class="skeleton" style="height:260px"></div></div>
                    </section>
                    <section class="panel panel-pad">
                        <h3 class="upper text-sm" style="margin-bottom:10px">Khoảng giá</h3>
                        <div class="stack" style="gap:8px" id="priceList"></div>
                        <p class="hint mt-2" id="priceHint"></p>
                    </section>
                </aside>
                <div style="min-width:0">
                    <div class="row wrap" id="activeFilters" style="margin-bottom:14px"></div>
                    <div class="product-grid" id="grid"><div class="skeleton" style="height:340px"></div><div class="skeleton" style="height:340px"></div><div class="skeleton" style="height:340px"></div><div class="skeleton" style="height:340px"></div><div class="skeleton" style="height:340px"></div><div class="skeleton" style="height:340px"></div></div>
                    <div class="row-between wrap mt-4" id="pager"></div>
                </div>
            </div>
        </div>
    </main>
    <footer id="siteFooter"></footer>
    <div class="toasts" id="toasts"></div>
    <script type="module" src="./js/pages/products.js"></script>
</body>
</html>
